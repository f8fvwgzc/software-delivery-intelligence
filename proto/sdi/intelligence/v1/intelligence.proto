syntax = "proto3";

package sdi.intelligence.v1;

import "google/protobuf/timestamp.proto";
import "sdi/common/v1/common.proto";

// Turns knowledge into ranked, evidence-backed proposals, negotiates them
// with the user and remembers the resulting decisions with provenance.
//
// Calls KnowledgeService for context and retrieval, and ExecutionService to
// hand an accepted plan over. It never executes anything itself.
service IntelligenceService {
  // --- Proposals ------------------------------------------------------------
  rpc GenerateProposal(GenerateProposalRequest) returns (Proposal);
  rpc ListProposals(ListProposalsRequest) returns (ListProposalsResponse);
  rpc GetProposal(GetProposalRequest) returns (Proposal);
  rpc AcceptProposal(AcceptProposalRequest) returns (Proposal);
  rpc RejectProposal(RejectProposalRequest) returns (Proposal);

  // --- Negotiation ----------------------------------------------------------
  // One user turn. May re-rank options and change the recommendation.
  rpc Negotiate(NegotiateRequest) returns (NegotiateResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);

  // --- Decision memory ------------------------------------------------------
  rpc ListDecisions(ListDecisionsRequest) returns (ListDecisionsResponse);
  rpc CreateDecision(CreateDecisionRequest) returns (Decision);
  rpc SupersedeDecision(SupersedeDecisionRequest) returns (Decision);

  // --- Documents and reports ------------------------------------------------
  rpc GenerateDocument(GenerateDocumentRequest) returns (Document);
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc GetDocument(GetDocumentRequest) returns (Document);

  rpc GetIntelligenceStats(GetIntelligenceStatsRequest) returns (IntelligenceStats);

  // --- Diagrams -------------------------------------------------------------
  // Builds a diagram spec (and its Mermaid) from the knowledge graph, tree and key files.
  rpc GenerateDiagram(GenerateDiagramRequest) returns (Diagram);
  rpc ListDiagrams(ListDiagramsRequest) returns (ListDiagramsResponse);
  rpc GetDiagram(GetDiagramRequest) returns (Diagram);
  // User edits: title, spec or Mermaid source. Bumps the revision.
  rpc UpdateDiagram(UpdateDiagramRequest) returns (Diagram);
  rpc DeleteDiagram(DeleteDiagramRequest) returns (DeleteDiagramResponse);

  // --- Code review ----------------------------------------------------------
  // Reviews a pull request in steps: context → analyze → findings → summary.
  // Returns immediately; progress arrives as diagram-style PlatformEvents and
  // the review object moves through its states.
  rpc StartReview(StartReviewRequest) returns (Review);
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse);
  rpc GetReview(GetReviewRequest) returns (Review);
  // Human verdict on one finding: accept / dismiss (with reason).
  rpc DecideFinding(DecideFindingRequest) returns (Finding);
  // Posts the review (summary + accepted findings) to GitHub as a PR review.
  rpc PublishReview(PublishReviewRequest) returns (Review);
  // Recent review and finding activity, newest first.
  rpc ListReviewActivity(ListReviewActivityRequest) returns (ListReviewActivityResponse);

  // --- Settings and live events ---------------------------------------------
  rpc GetSettings(GetSettingsRequest) returns (IntelligenceSettings);
  rpc UpdateSettings(UpdateSettingsRequest) returns (IntelligenceSettings);
  // Proposal, decision and document changes as they happen. Never ends.
  rpc WatchEvents(sdi.common.v1.WatchEventsRequest) returns (stream sdi.common.v1.PlatformEvent);

  // --- Workspace data (CONTRACT.md §19) ---------------------------------------
  // Removes everything this service stores for the workspace (owner only).
  rpc DeleteWorkspaceData(DeleteWorkspaceDataRequest) returns (DeleteWorkspaceDataResponse);
  // Streams every row this service stores for the workspace, one JSON object
  // per record, for the data export archive (admin).
  rpc ExportWorkspaceData(ExportWorkspaceDataRequest) returns (stream WorkspaceDataRecord);
}

// ---------------------------------------------------------------------------
// Proposals
// ---------------------------------------------------------------------------

enum ProposalKind {
  PROPOSAL_KIND_UNSPECIFIED = 0;
  PROPOSAL_KIND_DEPLOYMENT = 1;
  PROPOSAL_KIND_INFRASTRUCTURE = 2;
  PROPOSAL_KIND_CI_CD = 3;
  PROPOSAL_KIND_TESTING = 4;
  PROPOSAL_KIND_SECURITY = 5;
  PROPOSAL_KIND_DOCUMENTATION = 6;
  PROPOSAL_KIND_DEPENDENCY = 7;
  // Moves a legacy or transitional project up the maturity axes.
  PROPOSAL_KIND_MODERNIZATION = 8;
}

enum ProposalStatus {
  PROPOSAL_STATUS_UNSPECIFIED = 0;
  PROPOSAL_STATUS_PROPOSED = 1;
  PROPOSAL_STATUS_NEGOTIATING = 2;
  PROPOSAL_STATUS_ACCEPTED = 3;
  PROPOSAL_STATUS_REJECTED = 4;
  PROPOSAL_STATUS_SUPERSEDED = 5;
}

// Ranking signals, each 0.0 – 1.0. `overall` is the weighted sum.
message ScoreBreakdown {
  double semantic_similarity = 1;
  double policy = 2;
  double recency = 3;
  double success = 4;
  double architecture_fit = 5;
  double cost = 6;
  double security = 7;
  double overall = 8;
}

// Relative weight of each signal. Negotiation changes these.
message ScoreWeights {
  double semantic_similarity = 1;
  double policy = 2;
  double recency = 3;
  double success = 4;
  double architecture_fit = 5;
  double cost = 6;
  double security = 7;
}

enum EvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_FACT = 1;
  EVIDENCE_KIND_PATTERN = 2;
  EVIDENCE_KIND_DECISION = 3;
  EVIDENCE_KIND_DELIVERY_HISTORY = 4;
  EVIDENCE_KIND_SIMILAR_PROJECT = 5;
  EVIDENCE_KIND_POLICY = 6;
  EVIDENCE_KIND_ANSWER = 7;
}

// Why the engine believes something. Every claim in a proposal points at one.
message Evidence {
  EvidenceKind kind = 1;
  string ref_id = 2;
  string label = 3;
  string detail = 4;
}

message ProposalOption {
  string id = 1;
  string title = 2;
  string summary = 3;
  string pattern_id = 4;
  // 1 is the best ranked option.
  uint32 rank = 5;
  ScoreBreakdown score = 6;
  repeated string pros = 7;
  repeated string cons = 8;
  repeated Evidence evidence = 9;
  double estimated_monthly_cost_usd = 10;
  // Pattern requirements this project does not meet yet.
  repeated string unmet_requirements = 11;
  repeated sdi.common.v1.PlanStep plan = 12;
  // Real files this option would add to the repository, generated from the
  // project's facts. Committed by a `repo.open_pull_request` step.
  repeated Artifact artifacts = 13;
  repeated sdi.common.v1.CostLine cost_breakdown = 14;
}

// A generated file. Content is complete and ready to commit.
message Artifact {
  // Repository-relative, e.g. ".github/workflows/deploy.yml".
  string path = 1;
  string content = 2;
  // "dockerfile" | "yaml" | "hcl" | "bicep" | "json" | "markdown" | "nginx" | "text"
  string language = 3;
  // One sentence: why this file exists.
  string purpose = 4;
  // True when the repository already has a file at this path.
  bool replaces_existing = 5;
}

// A condition agreed during negotiation, e.g. "keep the current networking".
message Constraint {
  string key = 1;
  string description = 2;
  string source_message_id = 3;
}

message Proposal {
  string id = 1;
  string project_id = 2;
  ProposalKind kind = 3;
  ProposalStatus status = 4;
  string title = 5;
  string summary = 6;
  // What the user asked for, if anything.
  string prompt = 7;
  string recommended_option_id = 8;
  repeated ProposalOption options = 9;
  repeated Constraint constraints = 10;
  ScoreWeights weights = 11;
  // Bumped every time negotiation re-ranks the options.
  uint32 revision = 12;
  // "heuristic" | "claude"
  string reasoner = 13;
  string accepted_option_id = 14;
  // Execution created from the accepted option, if any.
  string execution_id = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

message GenerateProposalRequest {
  string project_id = 1;
  ProposalKind kind = 2;
  string prompt = 3;
  // 0 means no budget. Becomes the `budget_monthly_usd` constraint.
  double budget_monthly_usd = 4;
}

message ListProposalsRequest {
  // Empty lists proposals of every project.
  string project_id = 1;
  // Page size, newest first (default 50, max 200).
  uint32 limit = 2;
  // Cursor: proposals created strictly before this time.
  google.protobuf.Timestamp before = 3;
}

message ListProposalsResponse {
  repeated Proposal proposals = 1;
}

message GetProposalRequest {
  string id = 1;
}

message AcceptProposalRequest {
  string id = 1;
  // Empty accepts the recommended option.
  string option_id = 2;
  // Hand the plan to the execution service straight away.
  bool create_execution = 3;
  // Runtime for that execution (CONTRACT.md §5.4): "simulated" (default) runs
  // the option's own plan as a dry run; "docker" runs the local verification
  // plan (checkout → build → run → tests → destroy); "github" runs
  // checkout → open_pull_request with the option's artifacts.
  string adapter = 4;
}

message RejectProposalRequest {
  string id = 1;
  string reason = 2;
}

// ---------------------------------------------------------------------------
// Negotiation
// ---------------------------------------------------------------------------

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_ASSISTANT = 2;
  MESSAGE_ROLE_SYSTEM = 3;
}

message Message {
  string id = 1;
  string proposal_id = 2;
  MessageRole role = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
  // True when this assistant turn switched the recommended option.
  bool changed_recommendation = 6;
  repeated Evidence references = 7;
}

message NegotiateRequest {
  string proposal_id = 1;
  string content = 2;
}

message NegotiateResponse {
  Proposal proposal = 1;
  Message user_message = 2;
  Message reply = 3;
  // Set when the turn recorded a new decision ("we standardise on X because Y").
  Decision recorded_decision = 4;
}

message ListMessagesRequest {
  string proposal_id = 1;
}

message ListMessagesResponse {
  repeated Message messages = 1;
}

// ---------------------------------------------------------------------------
// Decisions (memory with provenance)
// ---------------------------------------------------------------------------

enum DecisionScope {
  DECISION_SCOPE_UNSPECIFIED = 0;
  DECISION_SCOPE_PROJECT = 1;
  DECISION_SCOPE_TEAM = 2;
  DECISION_SCOPE_DEPARTMENT = 3;
  DECISION_SCOPE_ORGANIZATION = 4;
}

enum DecisionStatus {
  DECISION_STATUS_UNSPECIFIED = 0;
  DECISION_STATUS_ACTIVE = 1;
  DECISION_STATUS_SUPERSEDED = 2;
}

enum DecisionSource {
  DECISION_SOURCE_UNSPECIFIED = 0;
  DECISION_SOURCE_MANUAL = 1;
  DECISION_SOURCE_NEGOTIATION = 2;
  DECISION_SOURCE_PROPOSAL_ACCEPTED = 3;
  DECISION_SOURCE_QUESTION_ANSWERED = 4;
}

message Decision {
  string id = 1;
  // Empty for decisions that are not tied to one project.
  string project_id = 2;
  DecisionScope scope = 3;
  DecisionStatus status = 4;
  DecisionSource source = 5;
  string title = 6;
  string statement = 7;
  repeated string reasons = 8;
  string approved_by = 9;
  string proposal_id = 10;
  // Machine tags the ranker matches on, e.g. "cloud:azure", "runtime:kubernetes".
  repeated string tags = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp superseded_at = 13;
  string superseded_by = 14;
}

message ListDecisionsRequest {
  // Empty lists every decision.
  string project_id = 1;
  bool include_superseded = 2;
}

message ListDecisionsResponse {
  repeated Decision decisions = 1;
}

message CreateDecisionRequest {
  string project_id = 1;
  DecisionScope scope = 2;
  string title = 3;
  string statement = 4;
  repeated string reasons = 5;
  string approved_by = 6;
  repeated string tags = 7;
}

message SupersedeDecisionRequest {
  string id = 1;
  // Decision that replaces it, if any.
  string superseded_by = 2;
}

// ---------------------------------------------------------------------------
// Documents
// ---------------------------------------------------------------------------

enum DocumentKind {
  DOCUMENT_KIND_UNSPECIFIED = 0;
  DOCUMENT_KIND_README = 1;
  DOCUMENT_KIND_ARCHITECTURE = 2;
  DOCUMENT_KIND_DEPLOYMENT_GUIDE = 3;
  DOCUMENT_KIND_RUNBOOK = 4;
  DOCUMENT_KIND_ADR = 5;
  DOCUMENT_KIND_UAT_PLAN = 6;
  DOCUMENT_KIND_EXECUTIVE_REPORT = 7;
  DOCUMENT_KIND_ENGINEERING_REPORT = 8;
}

// Generated from the knowledge model, never from guesswork.
message Document {
  string id = 1;
  string project_id = 2;
  DocumentKind kind = 3;
  string title = 4;
  string markdown = 5;
  string commit_sha = 6;
  uint32 facts_used = 7;
  google.protobuf.Timestamp generated_at = 8;
}

message GenerateDocumentRequest {
  string project_id = 1;
  DocumentKind kind = 2;
}

message ListDocumentsRequest {
  string project_id = 1;
  // Page size, newest first (default 50, max 200).
  uint32 limit = 2;
  // Cursor: documents generated strictly before this time.
  google.protobuf.Timestamp before = 3;
}

message ListDocumentsResponse {
  // Markdown bodies are omitted in list responses.
  repeated Document documents = 1;
}

message GetDocumentRequest {
  string id = 1;
}

// ---------------------------------------------------------------------------
// Diagrams (CONTRACT.md §16)
// ---------------------------------------------------------------------------

enum DiagramKind {
  DIAGRAM_KIND_UNSPECIFIED = 0;
  // Components, subsystems and the calls between them (the gitdiagram view).
  DIAGRAM_KIND_ARCHITECTURE = 1;
  // Actors, product, and the few external systems; one screen.
  DIAGRAM_KIND_HIGH_LEVEL = 2;
  DIAGRAM_KIND_DATA_FLOW = 3;
  // Where things run: environments, hosts, images, ports.
  DIAGRAM_KIND_DEPLOYMENT = 4;
  DIAGRAM_KIND_DEPENDENCY = 5;
  // The principal workflow as a sequence of calls.
  DIAGRAM_KIND_SEQUENCE = 6;
  // Directories and packages as a tree.
  DIAGRAM_KIND_MODULE_MAP = 7;
  DIAGRAM_KIND_DB_SCHEMA = 8;
  // Built from a free-text prompt (reasoner) or imported Mermaid.
  DIAGRAM_KIND_CUSTOM = 9;
}

message DiagramGroup {
  string id = 1;
  string label = 2;
  string description = 3;
  // Repository directory the group stands for, when there is one.
  string path = 4;
}

message DiagramNode {
  string id = 1;
  string label = 2;
  // "actor" | "service" | "module" | "ui" | "datastore" | "queue" | "external" | "infra" | "job"
  string kind = 3;
  string group_id = 4;
  // Repository path the node stands for; the web app links it to the code browser.
  string path = 5;
  string description = 6;
  // Short type caption under the label, e.g. "axum", "PostgreSQL".
  string caption = 7;
}

message DiagramEdge {
  string id = 1;
  string source = 2;
  string target = 3;
  // 1–3 words, e.g. "calls", "reads", "publishes".
  string label = 4;
  // "call" | "data" | "async" | "returns" | "contains"
  string style = 5;
  // Optional or unverified relationship.
  bool dashed = 6;
  // File that shows the relationship; empty when inferred.
  string evidence_path = 7;
}

message DiagramSpec {
  // "LR" | "TB"
  string direction = 1;
  repeated DiagramGroup groups = 2;
  repeated DiagramNode nodes = 3;
  repeated DiagramEdge edges = 4;
}

message Diagram {
  string id = 1;
  string project_id = 2;
  DiagramKind kind = 3;
  string title = 4;
  // 60–150 words: what the diagram shows and its evidence limits.
  string explanation = 5;
  DiagramSpec spec = 6;
  // Mermaid rendered from the spec, or the user's edited source.
  string mermaid = 7;
  // "generated" | "edited" | "mermaid"  (mermaid = the Mermaid source is authoritative)
  string source = 8;
  string commit_sha = 9;
  uint32 revision = 10;
  // "heuristic" | "claude"
  string reasoner = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message GenerateDiagramRequest {
  string project_id = 1;
  DiagramKind kind = 2;
  // Free text for CUSTOM, or a focus hint ("the payment flow") for other kinds.
  string prompt = 3;
}

message ListDiagramsRequest {
  string project_id = 1;
  // Page size, newest first (default 50, max 200).
  uint32 limit = 2;
  // Cursor: diagrams created strictly before this time.
  google.protobuf.Timestamp before = 3;
}

message ListDiagramsResponse {
  // Spec and mermaid are omitted in list responses.
  repeated Diagram diagrams = 1;
}

message GetDiagramRequest {
  string id = 1;
}

message UpdateDiagramRequest {
  string id = 1;
  string title = 2;
  // When set, replaces the spec and regenerates the Mermaid (source = "edited").
  DiagramSpec spec = 3;
  // When set, replaces the Mermaid source (source = "mermaid"); the spec is kept as is.
  string mermaid = 4;
}

message DeleteDiagramRequest {
  string id = 1;
}

message DeleteDiagramResponse {}

// ---------------------------------------------------------------------------
// Code review (CONTRACT.md §20)
// ---------------------------------------------------------------------------

enum ReviewStatus {
  REVIEW_STATUS_UNSPECIFIED = 0;
  // Reading the PR, touched facts and impacted graph nodes.
  REVIEW_STATUS_CONTEXT = 1;
  // Running the analyzers over the diff.
  REVIEW_STATUS_ANALYZING = 2;
  // Findings ready; waiting for the human to accept or dismiss.
  REVIEW_STATUS_PROPOSED = 3;
  // Posted to GitHub.
  REVIEW_STATUS_PUBLISHED = 4;
  REVIEW_STATUS_FAILED = 5;
}

enum FindingSeverity {
  FINDING_SEVERITY_UNSPECIFIED = 0;
  FINDING_SEVERITY_INFO = 1;
  FINDING_SEVERITY_LOW = 2;
  FINDING_SEVERITY_MEDIUM = 3;
  FINDING_SEVERITY_HIGH = 4;
  FINDING_SEVERITY_CRITICAL = 5;
}

enum FindingDecision {
  FINDING_DECISION_UNSPECIFIED = 0;
  FINDING_DECISION_PENDING = 1;
  FINDING_DECISION_ACCEPTED = 2;
  FINDING_DECISION_DISMISSED = 3;
}

message Finding {
  string id = 1;
  string review_id = 2;
  // "correctness" | "security" | "secrets" | "dependencies" | "ci" | "iac" | "docker" | "tests" | "docs" | "maturity" | "style"
  string category = 3;
  FindingSeverity severity = 4;
  string title = 5;
  // Markdown. States the evidence and the fix.
  string detail = 6;
  string path = 7;
  uint32 line = 8;
  uint32 end_line = 9;
  // Optional replacement for the referenced lines (a suggestion block).
  string suggestion = 10;
  // Rule id, e.g. "secrets.aws_key", "docker.root_user".
  string rule = 11;
  FindingDecision decision = 12;
  string decision_note = 13;
  string decided_by = 14;
  google.protobuf.Timestamp decided_at = 15;
}

message ReviewStep {
  // "context" | "analyze" | "findings" | "summary" | "publish"
  string key = 1;
  string label = 2;
  // "pending" | "running" | "done" | "failed"
  string status = 3;
  string detail = 4;
  uint32 duration_ms = 5;
}

message Review {
  string id = 1;
  string project_id = 2;
  string project_name = 3;
  uint64 pr_number = 4;
  string pr_title = 5;
  string pr_author = 6;
  string head_sha = 7;
  ReviewStatus status = 8;
  repeated ReviewStep steps = 9;
  // Markdown walkthrough: what changed, why it matters, risks, impacted components.
  string summary = 10;
  repeated Finding findings = 11;
  uint32 files_reviewed = 12;
  uint32 findings_total = 13;
  uint32 findings_accepted = 14;
  // "heuristic" | "claude"
  string reasoner = 15;
  // GitHub review URL once published.
  string published_url = 16;
  string error = 17;
  string requested_by = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
}

message StartReviewRequest {
  string project_id = 1;
  uint64 pr_number = 2;
}

message ListReviewsRequest {
  // Empty lists reviews of every project.
  string project_id = 1;
  uint32 limit = 2;
}

message ListReviewsResponse {
  // Findings and summary omitted.
  repeated Review reviews = 1;
}

message GetReviewRequest {
  string id = 1;
}

message DecideFindingRequest {
  string finding_id = 1;
  FindingDecision decision = 2;
  string note = 3;
}

message PublishReviewRequest {
  string review_id = 1;
  // "comment" (default) | "request_changes" | "approve"
  string event = 2;
}

message ReviewActivity {
  string id = 1;
  string review_id = 2;
  string project_id = 3;
  string project_name = 4;
  uint64 pr_number = 5;
  // "review.started" | "review.proposed" | "finding.accepted" | "finding.dismissed" | "review.published" | "review.failed"
  string action = 6;
  string actor = 7;
  string detail = 8;
  google.protobuf.Timestamp at = 9;
}

message ListReviewActivityRequest {
  string project_id = 1;
  uint32 limit = 2;
  google.protobuf.Timestamp before = 3;
}

message ListReviewActivityResponse {
  repeated ReviewActivity activity = 1;
}

// Ranking defaults and the reasoner. Changed from the settings page.
message IntelligenceSettings {
  ScoreWeights default_weights = 1;
  // "heuristic" | "claude" ("llm" is accepted as an alias): "claude" means
  // the configured provider (CONTRACT.md §19), whichever it is. The LLM
  // only answers when the workspace's data controls allow the reasoner and
  // a key exists; it falls back to the heuristic otherwise.
  string reasoner = 2;
  string model = 3;
  bool api_key_configured = 4;
  // Cost shrink: options above this monthly cost lose ranking unless a budget says otherwise.
  double cost_ceiling_usd = 5;
  // Code review (CONTRACT.md §20): `pull_request` webhooks (opened, synchronize)
  // start a review that stops at `proposed`. Default off.
  bool auto_review = 6;
  // Which API the reasoner speaks (CONTRACT.md §19): "anthropic" (Messages
  // API) or "openai_compatible" (chat completions: OpenAI, Azure OpenAI,
  // Ollama, vLLM, OpenRouter, Gemini's OpenAI endpoint). Empty reads
  // LLM_PROVIDER, else "anthropic".
  string reasoner_provider = 7;
  // Base URL of an OpenAI-compatible endpoint (e.g. http://ollama:11434/v1,
  // https://<res>.openai.azure.com/openai/deployments/<d>?api-version=...).
  // Empty reads LLM_BASE_URL, else the provider's public endpoint.
  string reasoner_base_url = 8;
  // Same value as `model`; the explicit name next to provider and base URL.
  string reasoner_model = 9;
  // Tokens (input + output) the workspace may spend per UTC day before the
  // reasoner falls back to the heuristic. Default 200000.
  uint64 reasoner_daily_token_cap = 10;
}

message GetSettingsRequest {}

message UpdateSettingsRequest {
  IntelligenceSettings settings = 1;
}

message GetIntelligenceStatsRequest {}

message IntelligenceStats {
  uint32 proposals = 1;
  uint32 proposals_open = 2;
  uint32 proposals_accepted = 3;
  uint32 decisions_active = 4;
  uint32 documents = 5;
  uint32 messages = 6;
  // Reasoner budget (CONTRACT.md §19): tokens spent today (UTC), the cap
  // and the calls made today.
  uint64 reasoner_tokens_today = 7;
  uint64 reasoner_daily_token_cap = 8;
  uint32 reasoner_calls_today = 9;
}

// ---------------------------------------------------------------------------
// Workspace data
// ---------------------------------------------------------------------------

message DeleteWorkspaceDataRequest {
  // Must match the caller's workspace (x-sdi-workspace).
  string workspace_id = 1;
}

message DeleteWorkspaceDataResponse {
  // Rows removed per entity ("proposal", "message", "decision", "document", "diagram", "settings").
  map<string, uint64> deleted = 1;
}

message ExportWorkspaceDataRequest {
  // Must match the caller's workspace (x-sdi-workspace).
  string workspace_id = 1;
}

message WorkspaceDataRecord {
  // "proposal" | "message" | "decision" | "document" | "diagram" | "settings"
  string entity = 1;
  // The full row as one JSON object.
  string json = 2;
}
