syntax = "proto3";

package sdi.common.v1;

option go_package = "github.com/f8fvwgzc/software-delivery-intelligence/services/gitops/gen/sdi/common/v1;commonv1";

import "google/protobuf/timestamp.proto";

// How much damage an action can do. Drives the approval policy.
enum RiskLevel {
  RISK_LEVEL_UNSPECIFIED = 0;
  RISK_LEVEL_SAFE = 1;
  RISK_LEVEL_MEDIUM = 2;
  RISK_LEVEL_HIGH = 3;
  RISK_LEVEL_BLOCKED = 4;
}

// Who may reuse a piece of knowledge during retrieval.
enum KnowledgeScope {
  KNOWLEDGE_SCOPE_UNSPECIFIED = 0;
  KNOWLEDGE_SCOPE_PRIVATE = 1;
  KNOWLEDGE_SCOPE_TEAM = 2;
  KNOWLEDGE_SCOPE_DEPARTMENT = 3;
  KNOWLEDGE_SCOPE_ORGANIZATION = 4;
  KNOWLEDGE_SCOPE_PUBLIC_TEMPLATE = 5;
}

// A change notification any service can emit. The gateway merges the
// services' streams into one SSE feed so the web app never has to poll.
message PlatformEvent {
  // "project" | "scan" | "proposal" | "decision" | "document" | "execution" | "approval" | "pattern" | "application"
  string entity = 1;
  string entity_id = 2;
  // Empty for entities that are not tied to one project.
  string project_id = 3;
  // "created" | "updated" | "deleted" | "progress"
  string action = 4;
  // Entity status after the change, in the entity's own vocabulary (e.g. "scanning").
  string status = 5;
  google.protobuf.Timestamp at = 6;
  map<string, string> data = 7;
}

message WatchEventsRequest {}

// One unit of work in an execution plan. Shared by pattern templates,
// proposal options and executions so a plan keeps its shape end to end.
message PlanStep {
  string key = 1;
  string title = 2;
  string description = 3;
  // Policy key, e.g. "cloud.create_dev_resource". See execution.v1.Policy.
  string action_type = 4;
  // Tool adapter that would run it: "github" | "docker" | "cloud" | "kubernetes" | "local".
  string adapter = 5;
  // Keys of the steps that must succeed first (edges of the execution DAG).
  repeated string depends_on = 6;
  // Permissions the executing identity must hold, e.g. "database:write".
  repeated string required_permissions = 7;
  map<string, string> params = 8;
  // How success is verified after the action, in plain words.
  string verification = 9;
}

// One line of a cost model. A pattern ships its lines as the catalog's
// baseline; a proposal option carries the lines rescaled for its project,
// and in both places they sum to the monthly estimate.
message CostLine {
  string item = 1;
  double monthly_usd = 2;
  string note = 3;
}
