# A minimal application for SDI's GitOps engine (docs/gitops.md): point an
# application at this folder to try a sync, a diff, history and rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
images:
  - name: hello
    newName: nginxinc/nginx-unprivileged
    newTag: 1.28-alpine
