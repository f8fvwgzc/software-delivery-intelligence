[workspace]
resolver = "3"
members = ["crates/*", "services/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
sdi-proto = { path = "crates/proto" }
sdi-common = { path = "crates/common" }
sdi-analyzer = { path = "crates/analyzer" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# gRPC (service-to-service)
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-health = "0.14"
prost = "0.14"
prost-types = "0.14"

# HTTP (public REST gateway)
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "request-id", "timeout", "catch-panic"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# OpenAPI contract
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }

# Data
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Parsing (repository analysis)
toml = "1.1"
serde_yaml_ng = "0.10"
regex = "1"
base64 = "0.23"
# Repository tarballs (knowledge scanner downloads one archive instead of one request per file)
tar = "0.4"
flate2 = "1"
# Streamed downloads land in a temporary file instead of memory
tempfile = "3"

# Identity: GitHub App JWTs (RS256), HMAC state/webhook signatures, AES-GCM at rest
jsonwebtoken = "11"
aes-gcm = "0.11"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

# Utilities
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
