# Production-shaped stack: nginx edge on :80, two gateway replicas, the four
# gRPC services and Postgres with pgvector, on private networks. Secrets come
# from the host environment or a git-ignored .env (compose interpolates it).
# Sign-in needs either the GitHub OAuth/App variables (docs/github-app.md)
# or SDI_DEV_LOGIN=1 with a GITHUB_TOKEN; SDI_SESSION_SECRET is always
# required (CONTRACT.md §18, docs/self-hosting.md).
#
#   make up            build + start, waits for every healthcheck
#   make up-local-exec same, plus the `local-exec` profile: the execution
#                      service gets the host's Docker socket (see the
#                      docker-socket service for what that means)
#   open http://localhost
name: sdi

x-rust-service: &rust-service
  restart: unless-stopped
  stop_grace_period: 15s
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  # Images are slim (no curl); the probe is bash /dev/tcp against the
  # service's own port (deploy/docker/healthcheck.sh).
  healthcheck:
    test: ["CMD", "bash", "/usr/local/bin/healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 20s

x-rust-env: &rust-env
  DATABASE_URL: postgres://sdi:sdi@postgres:5432/sdi
  LOG_FORMAT: json
  RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
  # Postgres pool per service (five services × this must fit the server's
  # max_connections, 100 by default) and the session statement timeout
  # that keeps a runaway query from pinning a connection (docs/self-hosting.md).
  DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
  # How long a stopping service waits for its background tasks (scans,
  # runners, audit entries) before exiting; keep under stop_grace_period.
  SHUTDOWN_GRACE_SECS: ${SHUTDOWN_GRACE_SECS:-10}

x-rust-build: &rust-build
  context: .
  dockerfile: deploy/docker/rust.Dockerfile

x-small: &small
  resources:
    limits:
      cpus: "0.50"
      memory: 256M
    reservations:
      memory: 64M

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # Six services × DB_MAX_CONNECTIONS (20) plus tooling must fit; the
    # image's default of 100 is below the pools' sum.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_USER: sdi
      POSTGRES_PASSWORD: sdi
      POSTGRES_DB: sdi
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdi -d sdi"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 128M
    logging: *logging

  # Who is calling (CONTRACT.md §18): GitHub OAuth sessions, GitHub App
  # installations, workspaces, membership, audit, data controls. The only
  # service that holds GitHub credentials for other people; everything it
  # stores is encrypted with SDI_SESSION_SECRET.
  identity:
    <<: *rust-service
    image: sdi/identity:${SDI_TAG:-local}
    build:
      <<: *rust-build
      args:
        SERVICE: identity
    environment:
      <<: *rust-env
      IDENTITY_LISTEN: 0.0.0.0:50054
      # Where users are sent back to after GitHub; also the origin that
      # `returnTo` is validated against and the cookie's host.
      SDI_PUBLIC_URL: ${SDI_PUBLIC_URL:-http://localhost}
      # 32+ bytes. Signs session tokens and encrypts stored OAuth tokens and
      # reasoner keys. Unset is a startup error, never a silent default:
      # `openssl rand -hex 32` and put it in .env.
      SDI_SESSION_SECRET: ${SDI_SESSION_SECRET:-}
      # GitHub OAuth app (individuals) and GitHub App (organisations). All
      # optional together with SDI_DEV_LOGIN=1, in which case /auth/login
      # creates a local session for the GITHUB_TOKEN account.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      # PEM, or the PEM base64-encoded on one line (easier in .env).
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SDI_DEV_LOGIN: ${SDI_DEV_LOGIN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    deploy: *small

  knowledge:
    <<: *rust-service
    image: sdi/knowledge:${SDI_TAG:-local}
    build:
      <<: *rust-build
      args:
        SERVICE: knowledge
    environment:
      <<: *rust-env
      KNOWLEDGE_LISTEN: 0.0.0.0:50051
      # Read-only token for scanning; `scripts/dev.sh` takes it from `gh`.
      # Organisation workspaces use short-lived installation tokens minted
      # by identity instead (Identity.GetInstallationToken).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      IDENTITY_GRPC_URL: http://identity:50054
      # A stage that hangs (GitHub, a transaction) fails the scan after
      # this; the whole pipeline after SCAN_TIMEOUT_SECS.
      SCAN_STAGE_TIMEOUT_SECS: ${SCAN_STAGE_TIMEOUT_SECS:-600}
      SCAN_TIMEOUT_SECS: ${SCAN_TIMEOUT_SECS:-1800}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    deploy:
      # Repository analysis holds file trees in memory (archives stream to
      # /tmp, never the heap); give it headroom.
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 64M

  intelligence:
    <<: *rust-service
    image: sdi/intelligence:${SDI_TAG:-local}
    build:
      <<: *rust-build
      args:
        SERVICE: intelligence
    environment:
      <<: *rust-env
      INTELLIGENCE_LISTEN: 0.0.0.0:50052
      KNOWLEDGE_GRPC_URL: http://knowledge:50051
      EXECUTION_GRPC_URL: http://execution:50053
      # Optional reasoner (CONTRACT.md §19): `anthropic` (Messages API) or
      # `openai_compatible` (OpenAI, Azure OpenAI, Ollama, vLLM, OpenRouter)
      # with its base URL, key and model. ANTHROPIC_* stay as aliases of the
      # Anthropic defaults; ranking stays deterministic without any of them.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # Pull request watcher (CONTRACT.md §23); 0 turns it off.
      SDI_PR_WATCH_SECONDS: ${SDI_PR_WATCH_SECONDS:-60}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      knowledge:
        condition: service_healthy
      execution:
        condition: service_healthy
    deploy: *small

  execution:
    <<: *rust-service
    image: sdi/execution:${SDI_TAG:-local}
    build:
      <<: *rust-build
      args:
        SERVICE: execution
    environment:
      <<: *rust-env
      EXECUTION_LISTEN: 0.0.0.0:50053
      KNOWLEDGE_GRPC_URL: http://knowledge:50051
      IDENTITY_GRPC_URL: http://identity:50054
      GITOPS_GRPC_URL: http://gitops:50055
      # The `github` adapter writes with the same token knowledge reads
      # with; opening pull requests needs `repo` write (docs/adapters.md).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Checkouts and build contexts of the `docker` adapter live on a named
      # volume because the root filesystem is read-only. rust.Dockerfile
      # creates the path owned by uid 10001 so the volume inherits it.
      SDI_RUN_DIR: /var/lib/sdi/run
      SDI_ALLOW_PRIVATE_DEPLOY_TARGETS: ${SDI_ALLOW_PRIVATE_DEPLOY_TARGETS:-}
      AZURE_DEVOPS_URL: ${AZURE_DEVOPS_URL:-}
      # Unset by default: the Docker CLI then uses /var/run/docker.sock,
      # which only exists under the local-exec profile. Set on the host to
      # point the adapter at a remote daemon instead (passed through as-is).
      DOCKER_HOST:
      # The CLI keeps its config and buildx state under DOCKER_CONFIG; HOME
      # is not writable in this container, /tmp is.
      DOCKER_CONFIG: /tmp/docker
    volumes:
      - rundata:/var/lib/sdi/run
      # /var/run is a symlink to /run in the image, so the daemon socket the
      # local-exec relay writes into this volume appears at the default
      # path. Without the profile the volume is simply empty.
      - docker-sock:/run
    extra_hosts:
      # Containers the docker adapter starts publish their port on the host;
      # this name is how the adapter reaches them from inside the stack.
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      knowledge:
        condition: service_healthy
    deploy: *small

  # The GitOps engine (CONTRACT.md §24): Go, Argo CD's gitops-engine
  # embedded. Reaches the Kubernetes clusters registered in the app with the
  # kubeconfigs stored as workspace secrets; nothing to configure here.
  gitops:
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      # The engine's kubectl path writes a short-lived kubeconfig and the
      # manifest it applies; keep both in memory, never on a disk.
      - /tmp
      - /dev/shm
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging
    image: sdi/gitops:${SDI_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/go.Dockerfile
    # Distroless image: the binary probes its own gRPC health service.
    healthcheck:
      test: ["CMD", "/usr/local/bin/sdi-gitops", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    environment:
      DATABASE_URL: postgres://sdi:sdi@postgres:5432/sdi
      LOG_FORMAT: json
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
      SHUTDOWN_GRACE_SECS: ${GITOPS_SHUTDOWN_GRACE_SECS:-25}
      GITOPS_LISTEN: 0.0.0.0:50055
      IDENTITY_GRPC_URL: http://identity:50054
      KNOWLEDGE_GRPC_URL: http://knowledge:50051
      GITOPS_RECONCILE_SECONDS: ${GITOPS_RECONCILE_SECONDS:-180}
      SDI_ALLOW_PRIVATE_DEPLOY_TARGETS: ${SDI_ALLOW_PRIVATE_DEPLOY_TARGETS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      knowledge:
        condition: service_healthy
    deploy: *small

  # local-exec profile only: hands the host's Docker socket to the execution
  # service. socat relays /var/run/docker.sock into the docker-sock volume,
  # which execution mounts at /run, so inside execution the daemon sits at
  # the default path and DOCKER_HOST stays unset. Compose cannot attach a
  # bind mount to a service only while a profile is active, which is why the
  # relay is its own container rather than a volume line on `execution`.
  #
  # SECURITY. The socket is root on this host: whoever holds it can run
  # `docker run --privileged -v /:/host`. With the profile on, the execution
  # service, and anything that can make it run a plan, can start containers
  # on this machine; cap_drop and read_only on the execution container limit
  # what its process may do locally, not what it may ask the daemon for.
  # Use the profile on a developer machine only. For anything shared, put a
  # filtering proxy (tecnativa/docker-socket-proxy) or rootless Docker
  # behind DOCKER_HOST instead of this relay.
  docker-socket:
    image: alpine/socat:1.8.0.3
    profiles: [local-exec]
    restart: unless-stopped
    command:
      - UNIX-LISTEN:/sock/docker.sock,fork,unlink-early,mode=666
      - UNIX-CONNECT:/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - docker-sock:/sock
    # Both ends are unix sockets; the relay needs no network at all.
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "test", "-S", "/sock/docker.sock"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 32M
        reservations:
          memory: 8M
    logging: *logging

  # Two replicas of one image behind nginx's least_conn pool. gateway-1 owns
  # the build; gateway-2 reuses the tag and never pulls. Replicas are
  # stateless (the authorize cache and stream counters are per replica
  # and bounded), so any number may run behind any balancer, sticky or not.
  gateway-1:
    <<: *rust-service
    image: sdi/gateway:${SDI_TAG:-local}
    build:
      <<: *rust-build
      args:
        SERVICE: gateway
    environment: &gateway-env
      <<: *rust-env
      GATEWAY_LISTEN: 0.0.0.0:8080
      KNOWLEDGE_GRPC_URL: http://knowledge:50051
      INTELLIGENCE_GRPC_URL: http://intelligence:50052
      EXECUTION_GRPC_URL: http://execution:50053
      GITOPS_GRPC_URL: http://gitops:50055
      # Every /api/v1 request is resolved through Identity.Authorize before
      # it reaches a service (CONTRACT.md §18).
      IDENTITY_GRPC_URL: http://identity:50054
      SDI_PUBLIC_URL: ${SDI_PUBLIC_URL:-http://localhost}
      SDI_DEV_LOGIN: ${SDI_DEV_LOGIN:-}
      # POST /api/v1/webhooks/github is verified at the HTTP surface
      # (HMAC over the raw body, CONTRACT.md §18) before anything is parsed,
      # answered 202 and worked off a per-replica queue of this depth.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      WEBHOOK_QUEUE_MAX: ${WEBHOOK_QUEUE_MAX:-256}
      # Per-replica memory bounds: Authorize answers kept (60 s each) and
      # open SSE streams one workspace may hold on this replica (429 past
      # it). Replicas share nothing, so no sticky sessions are needed: a
      # miss costs one Identity.Authorize.
      GATEWAY_AUTH_CACHE_MAX: ${GATEWAY_AUTH_CACHE_MAX:-10000}
      SSE_MAX_PER_WORKSPACE: ${SSE_MAX_PER_WORKSPACE:-50}
    networks:
      - frontend
      - backend
    depends_on: &gateway-deps
      identity:
        condition: service_healthy
      knowledge:
        condition: service_healthy
      intelligence:
        condition: service_healthy
      execution:
        condition: service_healthy
    deploy: *small

  gateway-2:
    <<: *rust-service
    image: sdi/gateway:${SDI_TAG:-local}
    pull_policy: never
    environment: *gateway-env
    networks:
      - frontend
      - backend
    depends_on: *gateway-deps
    deploy: *small

  web:
    image: sdi/web:${SDI_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${SDI_HTTP_PORT:-80}:8080"
    networks:
      - frontend
    depends_on:
      gateway-1:
        condition: service_healthy
      gateway-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 16M
    logging: *logging

networks:
  # Only web and the gateways sit on the edge network; Postgres and the gRPC
  # services are reachable solely through the gateway. Neither network is
  # `internal: true` because knowledge and identity need GitHub and
  # intelligence needs the Anthropic API.
  frontend:
  backend:

volumes:
  pgdata:
  # SDI_RUN_DIR of the execution service: checkouts and build contexts of
  # the docker adapter. Survives restarts so a paused run can resume.
  rundata:
  # Carries the relayed Docker socket from docker-socket to execution. Empty
  # whenever the local-exec profile is off.
  docker-sock:
