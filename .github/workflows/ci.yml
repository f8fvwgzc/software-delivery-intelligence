# Definition of done from CONTRACT.md §11, run on every push and PR. The
# cheap checks (rust, web, nginx) gate the image builds, which are slow, and
# the image builds gate the Playwright run, which reuses their layer cache.
# nightly.yml calls this whole file on a schedule.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    secrets:
      # A GitHub token for the account the e2e specs scan (GitHub forbids
      # secrets named GITHUB_*). Optional: without it the real-GitHub specs
      # are skipped and the dry-run path still runs.
      SDI_GITHUB_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  PNPM_VERSION: 10.18.1

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Same image and dev port as docker-compose.dev.yml so tests that need
      # a database find CONTRACT.md's default DATABASE_URL.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sdi
          POSTGRES_PASSWORD: sdi
          POSTGRES_DB: sdi
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U sdi -d sdi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://sdi:sdi@127.0.0.1:5440/sdi
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        # libprotobuf-dev provides google/protobuf/*.proto imported by the contracts.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
          protoc --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  go:
    # The GitOps engine (CONTRACT.md §24) is a Go module embedding Argo CD's
    # gitops-engine. The integration tests sync real manifests into a
    # throwaway kind cluster; its API server is on 127.0.0.1, which deploy
    # targets may only use with SDI_ALLOW_PRIVATE_DEPLOY_TARGETS=1.
    name: Go (vet, test against kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/gitops
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sdi
          POSTGRES_PASSWORD: sdi
          POSTGRES_DB: sdi
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U sdi -d sdi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://sdi:sdi@127.0.0.1:5440/sdi
      SDI_ALLOW_PRIVATE_DEPLOY_TARGETS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/gitops/go.mod
          cache-dependency-path: services/gitops/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - uses: helm/kind-action@v1
        with:
          cluster_name: sdi-gitops-ci

      - name: go test
        run: |
          kind get kubeconfig --name sdi-gitops-ci > "$RUNNER_TEMP/kind.kubeconfig"
          SDI_GITOPS_TEST_KUBECONFIG="$RUNNER_TEMP/kind.kubeconfig" go test ./... -count=1 -race

  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  nginx:
    name: nginx -t, compose, workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy/nginx in the runtime image
        run: >-
          docker run --rm -v "$PWD/deploy/nginx:/etc/nginx:ro"
          nginxinc/nginx-unprivileged:1.28-alpine nginx -t

      - name: Validate docker-compose.yml (with and without local-exec)
        run: |
          docker compose config --quiet
          docker compose --profile local-exec config --quiet

      - name: Syntax-check the shell scripts
        run: bash -n scripts/*.sh deploy/docker/healthcheck.sh

      - name: Build the Kubernetes kustomization
        # kubectl is on the runner image; the example secrets stand in for
        # the real file, which is git-ignored.
        run: |
          cp deploy/k8s/secrets.example.env deploy/k8s/secrets.env
          kubectl kustomize deploy/k8s > /tmp/k8s.yaml
          grep -c '^kind:' /tmp/k8s.yaml

      - name: Lint the workflows
        # actionlint catches wrong expressions, unknown action inputs and
        # shellcheck findings in run: blocks before a run ever fails on them.
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.7 -color

  docker:
    name: Image ${{ matrix.image }}
    needs: [rust, go, web, nginx]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [gateway, identity, knowledge, intelligence, execution, gitops, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve build settings
        id: cfg
        run: |
          if [ "${{ matrix.image }}" = web ]; then
            {
              echo "dockerfile=deploy/docker/web.Dockerfile"
              echo "args="
              echo "scope=web"
            } >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.image }}" = gitops ]; then
            {
              echo "dockerfile=deploy/docker/go.Dockerfile"
              echo "args="
              echo "scope=gitops"
            } >> "$GITHUB_OUTPUT"
          else
            # One cache scope for all Rust images: the cargo-chef dependency
            # layer is identical across SERVICE values.
            {
              echo "dockerfile=deploy/docker/rust.Dockerfile"
              echo "args=SERVICE=${{ matrix.image }}"
              echo "scope=rust"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.cfg.outputs.dockerfile }}
          build-args: ${{ steps.cfg.outputs.args }}
          push: false
          load: false
          tags: sdi/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.cfg.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.cfg.outputs.scope }}

  e2e:
    # CONTRACT.md §11: `pnpm e2e` against `make up`. The images come out of
    # the layer cache the docker job just filled, so this job mostly pays
    # for the stack start and the browser run, not for a cold Rust build.
    name: Playwright against make up
    needs: [docker]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # compose interpolates GITHUB_TOKEN into the knowledge and execution
      # containers. With no SDI_GITHUB_TOKEN secret the token is empty and
      # SDI_E2E_GITHUB=0 tells the specs to skip everything that needs the
      # real account; the dry-run critical path does not.
      GITHUB_TOKEN: ${{ secrets.SDI_GITHUB_TOKEN }}
      SDI_E2E_GITHUB: ${{ secrets.SDI_GITHUB_TOKEN != '' && '1' || '0' }}
      # No GitHub OAuth app on the runner: the specs sign in through the dev
      # login (CONTRACT.md §18), which needs a session secret like any other
      # mode. Generated per run, never a repository secret.
      SDI_DEV_LOGIN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Generate a session secret for this run
        run: echo "SDI_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # The lockfile pins @playwright/test, and the browser build it
          # wants changes only when that pin does.
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web

      - name: Install Playwright system dependencies
        # The browser came from the cache; the apt packages it needs did not.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: web

      - uses: docker/setup-buildx-action@v3

      - name: Build the stack images from the shared layer cache
        # Bake reads the compose file directly; the targets are the services
        # with a build section, tagged exactly as compose expects them.
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            identity.cache-from=type=gha,scope=rust
            knowledge.cache-from=type=gha,scope=rust
            intelligence.cache-from=type=gha,scope=rust
            execution.cache-from=type=gha,scope=rust
            gitops.cache-from=type=gha,scope=gitops
            gateway-1.cache-from=type=gha,scope=rust
            web.cache-from=type=gha,scope=web

      - name: make up
        # No --build: the images were just loaded. --wait returns once every
        # healthcheck passes, including the gateway's own /api/v1/health.
        run: make up UP_FLAGS=

      - name: Wait for the API through nginx
        # The edge is the one thing --wait does not prove end to end.
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost/api/v1/health | grep -q '"ok"'; then
              exit 0
            fi
            sleep 2
          done
          echo "the gateway never answered through nginx" >&2
          docker compose ps
          exit 1

      - name: pnpm e2e
        run: pnpm e2e
        working-directory: web

      - name: Collect stack logs
        if: always()
        run: docker compose logs --no-color --timestamps > compose.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
            compose.log
          if-no-files-found: ignore
          retention-days: 7

      - name: make down
        if: always()
        run: make down
