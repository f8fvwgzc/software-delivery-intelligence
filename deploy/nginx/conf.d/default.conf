# The single virtual host: SPA from /usr/share/nginx/html, /api/ to the
# gateway pool. Rate limits and the SSE exception follow CONTRACT.md §10.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # add_header is not inherited once a location sets its own, so the
    # security set lives in a snippet that every such location includes.
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control $static_cache_control always;

    # Inherited by every proxied location; the SSE route lengthens them.
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Liveness for the container healthcheck and `docker compose up --wait`.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Live execution events: one long-lived response per watcher, never
    # buffered or compressed, and never timed out at the usual 60s.
    location ~ ^/api/v1/executions/[^/]+/events/stream$ {
        limit_req zone=api burst=40 nodelay;
        limit_conn perip 32;
        include /etc/nginx/snippets/api-errors.conf;

        include /etc/nginx/snippets/proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
        gzip off;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Accel-Buffering "no" always;
    }

    # Interactive API reference and the OpenAPI contract, served by the
    # gateway. Listed explicitly so the public surface is visible here.
    location = /api/docs {
        limit_req zone=api burst=40 nodelay;
        limit_conn perip 32;
        include /etc/nginx/snippets/api-errors.conf;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /api/openapi.json {
        limit_req zone=api burst=40 nodelay;
        limit_conn perip 32;
        include /etc/nginx/snippets/api-errors.conf;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req zone=mutations burst=10 nodelay;
        limit_conn perip 32;
        include /etc/nginx/snippets/api-errors.conf;
        include /etc/nginx/snippets/proxy.conf;
    }

    # 429 in the same shape as every gateway error: { code, message }.
    location @rate_limited {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After "1" always;
        return 429 '{"code":"rate_limited","message":"Too many requests"}';
    }

    # Every gateway replica is down or refusing: the gateway cannot answer
    # for itself, so the edge does, in the same shape.
    location @api_unavailable {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After "5" always;
        return 502 '{"code":"upstream_unavailable","message":"The API is temporarily unavailable"}';
    }

    location @api_timeout {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        return 504 '{"code":"upstream_timeout","message":"The API did not respond in time"}';
    }

    # Hashed build output: served as-is, immutable for a year (see map).
    location /assets/ {
        try_files $uri =404;
    }

    # SPA: unknown paths fall back to the app shell, which routes client-side.
    # index.html itself stays no-cache through the map above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
