# Errors nginx itself generates on API routes come back in the gateway's
# error shape ({ code, message }) so the web client never sees an HTML page.
# Gateway responses pass through untouched (proxy_intercept_errors is off).
# error_page is not inherited once a location sets one, so every proxied
# location includes this file.

error_page 429 = @rate_limited;
error_page 502 503 = @api_unavailable;
error_page 504 = @api_timeout;
