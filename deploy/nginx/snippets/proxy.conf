# Shared proxy settings for every /api/ location. HTTP/1.1 with an empty
# Connection header is what keeps the upstream keepalive pool working.

proxy_pass http://gateway;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Request-Id $request_id_out;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# Timeouts are set once at server level (default.conf) so the SSE location
# can override them; a directive repeated in one context is a config error.

# Only safe methods are retried on another replica (nginx default for
# non-idempotent requests); 502/503 covers a replica mid-restart.
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;

proxy_hide_header X-Powered-By;
# The edge owns the response's X-Request-Id (security-headers.conf adds the
# forwarded value), so the gateway's echo is dropped rather than duplicated.
proxy_hide_header X-Request-Id;
