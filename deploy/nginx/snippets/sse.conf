# Server-sent events (CONTRACT.md §10): one long-lived response per watcher,
# never buffered, cached or compressed, and never timed out at the usual 60s.
# Every SSE location includes this file so the three routes cannot drift.
#
# No limit_req here on purpose. A tab holds one connection per stream for as
# long as it is open and reconnects after any drop; a 429 on that reconnect
# would silently blind the UI while the REST calls still succeed. limit_conn
# stays: it caps how many such connections one address may hold at once,
# which is the only abuse a stream can be used for.

limit_conn perip 32;
include /etc/nginx/snippets/api-errors.conf;

include /etc/nginx/snippets/proxy.conf;
proxy_buffering off;
proxy_cache off;
proxy_request_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
chunked_transfer_encoding on;
gzip off;

include /etc/nginx/snippets/security-headers.conf;
add_header Cache-Control "no-cache" always;
add_header X-Accel-Buffering "no" always;
