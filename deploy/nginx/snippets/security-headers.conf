# Baseline browser hardening. `always` so error responses carry them too.
# No HSTS here: TLS terminates in front of this container when deployed
# publicly, and that layer owns the header.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Request-Id $request_id_out always;
