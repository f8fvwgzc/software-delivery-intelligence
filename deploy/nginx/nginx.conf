# Edge for the whole platform (CONTRACT.md §10): static web app, reverse proxy
# and rate limiter in front of the gateway replicas. Written for
# nginxinc/nginx-unprivileged (uid 101, port 8080, state under /tmp), so the
# container can run with a read-only root filesystem.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    types_hash_max_size 2048;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # One JSON object per line so the container log driver ships it as-is.
    log_format json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id_out",'
        '"remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer","user_agent":"$http_user_agent",'
        '"forwarded_for":"$http_x_forwarded_for"}';
    access_log /var/log/nginx/access.log json buffer=32k flush=5s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/manifest+json image/svg+xml
        application/xml;

    # Honour a caller's X-Request-Id, otherwise mint one; it travels to the
    # gateway and back out, and is the correlation key in the access log.
    map $http_x_request_id $request_id_out {
        default $http_x_request_id;
        ""      $request_id;
    }

    # Mutations get their own, stricter budget: the key is empty for safe
    # methods, and nginx does not count requests with an empty key.
    map $request_method $mutation_key {
        default "";
        POST    $binary_remote_addr;
        PUT     $binary_remote_addr;
        PATCH   $binary_remote_addr;
        DELETE  $binary_remote_addr;
    }

    # Static caching policy: Vite hashes everything under /assets/, so those
    # are immutable; index.html (and anything un-hashed) must revalidate.
    # Empty value for the API so an add_header does not duplicate upstream's.
    map $uri $static_cache_control {
        default     "no-cache";
        ~^/assets/  "public, max-age=31536000, immutable";
        ~^/api/     "";
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $mutation_key zone=mutations:10m rate=5r/s;
    # GitHub webhook deliveries: POSTs from a handful of GitHub addresses,
    # bursty after a push to a busy organisation. They get their own budget
    # instead of the per-address mutation one, which would drop deliveries
    # (GitHub retries nothing but a 5xx timeout).
    limit_req_zone $binary_remote_addr zone=webhooks:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    upstream gateway {
        # Shared zone + resolve: nginx re-resolves the replica names through
        # Docker's DNS, so a restarted gateway with a new address is picked
        # up without a reload (open source nginx >= 1.27.3).
        zone gateway 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        least_conn;
        server gateway-1:8080 resolve max_fails=3 fail_timeout=10s;
        server gateway-2:8080 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    include /etc/nginx/conf.d/*.conf;
}
