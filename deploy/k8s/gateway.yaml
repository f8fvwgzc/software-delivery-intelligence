# The public REST gateway: stateless, horizontally scaled by the HPA below.
# Readiness is the real liveness route (`GET /api/v1/health`); the
# authorize cache and stream counters are per pod and bounded, so no
# session affinity is configured anywhere (ingress or Service).
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: sdi/gateway
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sdi-config
          env:
            - name: GATEWAY_LISTEN
              value: 0.0.0.0:8080
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: sdi-secrets, key: GITHUB_WEBHOOK_SECRET, optional: true } }
            - name: GITHUB_APP_SLUG
              valueFrom: { secretKeyRef: { name: sdi-secrets, key: GITHUB_APP_SLUG, optional: true } }
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
