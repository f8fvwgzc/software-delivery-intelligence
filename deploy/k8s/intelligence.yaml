# intelligence (gRPC on 50052). Liveness and readiness use the gRPC health
# service every Rust service registers (tonic-health), which Kubernetes
# probes natively (grpc probes, GA since 1.27).
apiVersion: v1
kind: Service
metadata:
  name: intelligence
spec:
  selector:
    app.kubernetes.io/name: intelligence
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: intelligence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intelligence
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: intelligence
          image: sdi/intelligence
          ports:
            - name: grpc
              containerPort: 50052
          envFrom:
            - configMapRef:
                name: sdi-config
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: sdi-secrets, key: DATABASE_URL } }
            - name: INTELLIGENCE_LISTEN
              value: 0.0.0.0:50052
            - name: KNOWLEDGE_GRPC_URL
              valueFrom: { configMapKeyRef: { name: sdi-config, key: KNOWLEDGE_GRPC_URL } }
            - name: EXECUTION_GRPC_URL
              valueFrom: { configMapKeyRef: { name: sdi-config, key: EXECUTION_GRPC_URL } }
            - name: IDENTITY_GRPC_URL
              valueFrom: { configMapKeyRef: { name: sdi-config, key: IDENTITY_GRPC_URL } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: sdi-secrets, key: ANTHROPIC_API_KEY, optional: true } }
          readinessProbe:
            grpc:
              port: 50052
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            # Streamed repository archives (≤ 50 MB each) land here.
            sizeLimit: 1Gi
