# identity (gRPC on 50054). Liveness and readiness use the gRPC health
# service every Rust service registers (tonic-health), which Kubernetes
# probes natively (grpc probes, GA since 1.27).
apiVersion: v1
kind: Service
metadata:
  name: identity
spec:
  selector:
    app.kubernetes.io/name: identity
  ports:
    - name: grpc
      port: 50054
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity
          image: sdi/identity
          ports:
            - name: grpc
              containerPort: 50054
          envFrom:
            - configMapRef:
                name: sdi-config
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: sdi-secrets, key: DATABASE_URL } }
            - name: IDENTITY_LISTEN
              value: 0.0.0.0:50054
            - name: SDI_PUBLIC_URL
              valueFrom: { configMapKeyRef: { name: sdi-config, key: SDI_PUBLIC_URL } }
            - name: GITHUB_API_URL
              valueFrom: { configMapKeyRef: { name: sdi-config, key: GITHUB_API_URL } }
            - name: SDI_SESSION_SECRET
              valueFrom: { secretKeyRef: { name: sdi-secrets, key: SDI_SESSION_SECRET } }
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom: { secretKeyRef: { name: sdi-secrets, key: GITHUB_OAUTH_CLIENT_ID, optional: true } }
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: sdi-secrets, key: GITHUB_OAUTH_CLIENT_SECRET, optional: true } }
            - name: GITHUB_APP_ID
              valueFrom: { secretKeyRef: { name: sdi-secrets, key: GITHUB_APP_ID, optional: true } }
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: sdi-secrets, key: GITHUB_APP_PRIVATE_KEY, optional: true } }
            - name: GITHUB_TOKEN
              valueFrom: { secretKeyRef: { name: sdi-secrets, key: GITHUB_TOKEN, optional: true } }
          readinessProbe:
            grpc:
              port: 50054
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 50054
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            # Streamed repository archives (≤ 50 MB each) land here.
            sizeLimit: 1Gi
